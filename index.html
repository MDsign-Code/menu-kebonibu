<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kebonibu Food park & Cafe - Menu Digital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Android & PWA App Config -->
  <meta name="theme-color" content="#70bf44">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Menu Kebonibu">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
  <link rel="apple-touch-icon" href="images/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Sticky Navigation Bar -->
  <header class="top-bar">
    <div class="top-bar-inner">
      <a href="#" class="brand-pill" title="Kebonibu Food park & Cafe">
        <img src="images/logo-kebonibu.png" alt="Kebonibu Food park & Cafe" class="header-logo-img">
      </a>

      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Cari menu (Konro, Sei, Gurame, Kopi)...">
      </div>

      <div class="header-actions">
        <button class="install-btn" id="installAppBtn" style="display:none;" onclick="triggerInstallApp()">
          📲 Install App
        </button>
        <button class="cart-btn" id="openCartBtn">
          🛒 Pesanan <span class="cart-badge" id="cartCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Category Nav Bar (Halaman PDF) -->
  <nav class="cat-nav-wrapper">
    <div class="cat-nav" id="catNav">
      <button class="cat-pill active" data-cat="all">Semua Menu</button>
      <button class="cat-pill" data-cat="special">⭐ Menu Special</button>
      <button class="cat-pill" data-cat="kambing-sapi">🐐 Kambing & Sapi</button>
      <button class="cat-pill" data-cat="timbel">🍱 Paket Timbel</button>
      <button class="cat-pill" data-cat="steak-sei">🥩 Steak & Sei</button>
      <button class="cat-pill" data-cat="bbq">🔥 Barbeque & Grill</button>
      <button class="cat-pill" data-cat="seafood">🐟 Seafood</button>
      <button class="cat-pill" data-cat="ayam-sayur">🍗 Ayam & Sayur</button>
      <button class="cat-pill" data-cat="snack">🍟 Snack & Roti</button>
      <button class="cat-pill" data-cat="minuman">☕ Minuman & Kopi</button>
    </div>
  </nav>

  <!-- Main Content Container -->
  <main class="main-container">

    <!-- Hero Banner / Page 1 Cover -->
    <div class="cover-card">
      <img src="images/logo-kebonibu.png" alt="Kebonibu Food park & Cafe" class="cover-logo-img">
      <div class="fancy-menu-title">Menu</div>
      <p class="cover-address">
        JL. MASJID AL TAQWA NO 88 RT.002/RW.001, JATIRANGGA, KEC. JATISAMPURNA, KOTA BEKASI<br>
        📞 WhatsApp: <b>0811-1000-4608</b>
      </p>
    </div>

    <!-- Dynamic Menu Sections Render Container -->
    <div id="menuSectionsContainer"></div>

    <!-- Outlet Info Footer -->
    <footer class="footer-card">
      <img src="images/logo-kebonibu.png" alt="Kebonibu Food park & Cafe" class="footer-logo-img">
      <p style="color:#b0b5be; font-size:13px; margin: 12px 0 10px;">Buka setiap hari • Suasana asri & nyaman keluarga</p>
      <a href="https://wa.me/6281110004608" target="_blank" class="wa-btn-footer">
        <span>📲 Chat WhatsApp: 0811-1000-4608</span>
      </a>
    </footer>

  </main>

  <!-- Cart Drawer & Backdrop -->
  <div class="backdrop" id="cartBackdrop"></div>
  <div class="cart-drawer" id="cartDrawer">
    <div class="cart-drawer-header">
      <div class="cart-header-title">
        <span class="cart-header-icon">🛒</span>
        <div>
          <h3>Pesanan Saya</h3>
          <p class="cart-header-sub">Kebonibu Food park & Cafe</p>
        </div>
      </div>
      <button class="btn-close-cart" id="closeCartBtn" aria-label="Tutup">&times;</button>
    </div>
    
    <div class="cart-items-list" id="cartItemsList"></div>

    <div class="cart-summary-box">
      <div class="cart-summary-row">
        <span>Total Pembayaran:</span>
        <span id="cartTotalPrice" class="cart-total-val">Rp 0</span>
      </div>
    </div>

    <div class="cart-form-section">
      <div class="form-group">
        <label for="custTable" class="form-label">📍 Nomor Meja</label>
        <input type="text" id="custTable" class="input-field" placeholder="Cth: Meja 05">
      </div>
      <div class="form-group">
        <label for="custNotes" class="form-label">📝 Catatan Pesanan</label>
        <input type="text" id="custNotes" class="input-field" placeholder="Cth: Sambal dipisah">
      </div>
    </div>

    <button class="btn-checkout-wa" id="checkoutWaBtn">
      <span>📲 Kirim Pesanan ke WhatsApp (0811-1000-4608)</span>
    </button>
  </div>

  <div id="toast"></div>

  <script src="app.js"></script>
  <script>
    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration:', err));
      });
    }

    // PWA Install Prompt for Android
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById('installAppBtn');
      if (btn) btn.style.display = 'inline-flex';
    });

    function triggerInstallApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choice) => {
          if (choice.outcome === 'accepted') {
            const btn = document.getElementById('installAppBtn');
            if (btn) btn.style.display = 'none';
          }
          deferredPrompt = null;
        });
      }
    }
  </script>
</body>
</html>
